server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 400
      min-spare: 50
    max-connections: 10000
    accept-count: 2000
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  application:
    name: csp-platform
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/csp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: csp_root_2026
    hikari:
      maximum-pool-size: 60
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CspHikariPool
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 20
          min-idle: 5
    mongodb:
      uri: mongodb://127.0.0.1:27017/csp
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.csp.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

csp:
  jwt:
    secret: ${CSP_JWT_SECRET:csp-default-secret-key-please-change-in-production-env-2026}
    expire-seconds: 7200
    refresh-expire-seconds: 604800
    issuer: csp
  docker:
    enabled: false
    host: tcp://localhost:2375
    port-start: 40000
    port-end: 50000
    default-cpu: "1.0"
    default-memory: 512m
    network-prefix: csp-net-
  security:
    # 接口限流：默认每分钟 300 次
    rate-limit-per-minute: 300
    # 是否开启接口日志埋点
    access-log-enabled: true
  # 微信开放平台扫码登录：appId/appSecret 任一为空则自动降级为演示模式
  wechat:
    app-id: ${CSP_WX_APPID:}
    app-secret: ${CSP_WX_SECRET:}
    redirect-uri: ${CSP_WX_REDIRECT:http://127.0.0.1:11001/login}
    qr-expire-seconds: 300
  # 通知渠道：短信网关（真实短信下发，未配置则走本地演示模式）
  notify:
    sms-enabled: ${CSP_SMS_ENABLED:false}
    sms-gateway: ${CSP_SMS_GATEWAY:}
    sms-token: ${CSP_SMS_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.csp: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  file:
    name: logs/csp.log
